
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Karyawan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-3">
              
                <div class="card">
                    <div class="card-header" bg-primary>
                        Menu
                    </div>
                    <div class="card-body">
                       <div class="list-group">
                        <a href="#" class="list-group-item">Daftar Karyawan</a>
                        <a href="index.html" class="list-group-item">Tambah  Karyawan</a>

                       </div>
                    </div>
                </div>
            </div>
            <div class="col-9">
                <div class="card">
                    <div class="card-header">
                        Tambah Karyawan
                    </div>
                    <div class="card-body" id="gtw">
                        <div class="mb-3">
                          <label for="Nama" class="form-label">Nama Karyawan</label>
                          <input type="text" class="form-control" id="nama">
                      </div>

                        <div class="mb-3">
                            <label for="NIK" class="form-label">NIK</label>
                            <input type="text" class="form-control" id="nik">
                        </div>
                     
                        <div class="mb-3">
                            <label  class="form-label">Masa Kerja</label>
                            <input type="number" class="form-control" id="mk">
                        </div>
                        

                       
                    </div>
                    <div class="card-footer">
                            <button type="button" class="btn btn-outline-success" onclick="tambahKaryawan()" onclick="editKaryawan()">Submit</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="cancel()">Cancel</button>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-body">
                        <table class="table table-striped table-hover" id="tbl-Karyawan">
                            <thead>
                                <tr>
                                    
                                  <th scope="col">No</th>
                                  <th scope="col">NIK</th>
                                  <th scope="col">Nama</th>
                                  <th scope="col">Masa Kerja</th>
                                  <th scope="col">Gaji</th>
                                </tr>
                              </thead>

                          </table>
                    </div>
                  </div>
            </div>
        </div>
    </div>
    <script src="karyawan.js"></script>
</body>
</html>
