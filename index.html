
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-3">
              
                <div class="card">
                    <div class="card-header" bg-primary>
                        Menu
                    </div>
                    <div class="card-body">
                       <div class="list-group">
                        <a href="#" class="list-group-item">Daftar Siswa</a>
                        <a href="index.html" class="list-group-item">Tambah  Siswa</a>

                       </div>
                    </div>
                </div>
            </div>
            <div class="col-9">
                <div class="card">
                    <div class="card-header">
                        Tambah Siswa
                    </div>
                    <div class="card-body" id="gtw">
                        <div class="mb-3">
                            <label for="nama" class="form-label">Nama</label>
                            <input type="text" class="form-control" id="txtnama">
                        </div>
                        <div class="mb-3">
                            <label for="Jk" class="form-label">Jenis Kelamin</label>
                            <select class="form-control" id="jenKel">
                                <option value="">Pilih Jenis Kelamin</option>
                                <option value="Laki Laki">Laki laki</option>
                                <option value="Perempuan">Perempuan</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="Age" class="form-label">Umur</label>
                            <input type="number" class="form-control" id="umur">
                        </div>
                        <div class="mb-3">
                            <label for="wFav" class="form-label">Warna Favorite</label>
                            <select class="form-control" id="wFav">
                                <option value="">Pilih Warna Favorite</option>
                                <option value="Merah">Merah</option>
                                <option value="Kuning">Kuning</option>
                                <option value="Hijau">Hijau</option>
                                <option value="Biru">Biru</option>
                                <option value="Coklat">Coklat</option>
                                <option value="Ungu">Ungu</option>
                            </select>
                        </div>

                       
                    </div>
                    <div class="card-footer">
                            <button type="button" class="btn btn-outline-success" onclick="tambahSiswa()" onclick="editSiswa()">Submit</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="cancel()">Cancel</button>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-body">
                        <table class="table table-striped table-hover" id="tbl-siswa">
                            <thead>
                                <tr>
                                    
                                  <th scope="col">No</th>
                                  <th scope="col">Nama</th>
                                  <th scope="col">Jenis Kelamin</th>
                                  <th scope="col">Umur</th>
                                  <th scope="col">Warna Favorite</th>
                                </tr>
                              </thead>

                          </table>
                    </div>
                  </div>
            </div>
        </div>
    </div>
</body>
<script src="arrayAndObject.js"></script>
</html>
